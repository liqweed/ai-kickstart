name: App

# The companion app (app/). Run by hand to build without publishing; on an
# app-vX.Y.Z tag, also publish a GitHub *pre-release* for testers. The kit's
# own releases use v* tags and release.yml; a pre-release never becomes
# "Latest", so the kit's download links are unaffected.
# Unsigned until K21: macOS asks to confirm in System Settings, Windows shows SmartScreen.
on:
  workflow_dispatch:
  push:
    tags: ["app-v*"]

permissions:
  contents: read

env:
  TINYJS_VERSION: v0.51.1

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macos-arm64
          - os: windows-latest
            label: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tag matches app/tinyjs.json
        if: startsWith(github.ref, 'refs/tags/app-v')
        shell: bash
        run: |
          version="$(node -p "require('./app/tinyjs.json').version")"
          [ "${GITHUB_REF_NAME#app-v}" = "$version" ] || { echo "Tag $GITHUB_REF_NAME does not match app/tinyjs.json $version" >&2; exit 1; }
      - name: Lint
        run: pnpm --filter @ai-kickstart/app lint
      - name: Install tinyjs (macOS)
        if: runner.os == 'macOS'
        run: |
          curl -fsSL https://tinyjs.app/install -o "$RUNNER_TEMP/install.sh"
          TINYJS_NO_MODIFY_PATH=1 sh "$RUNNER_TEMP/install.sh"
          echo "$HOME/.tinyjs" >> "$GITHUB_PATH"
      - name: Install tinyjs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://tinyjs.app/install.ps1 | iex
          Add-Content $env:GITHUB_PATH (Join-Path $env:LOCALAPPDATA 'tinyjs')
      - name: Build and pack (macOS)
        if: runner.os == 'macOS'
        working-directory: app
        run: |
          tinyjs version
          tinyjs publish < /dev/null
          mkdir -p ../out
          cp dist/publish/*.zip "../out/ai-kickstart-app-$(node -p "require('./tinyjs.json').version")-${{ matrix.label }}.zip"
      # Not `tinyjs publish`: it packs with whichever `tar` is on PATH and
      # relies on bsdtar writing zip for a .zip name; Git's GNU tar writes a tar.
      # The page rides inside ai-kickstart.exe, so dist/ is just the two .exe files.
      - name: Build and pack (Windows)
        if: runner.os == 'Windows'
        working-directory: app
        shell: pwsh
        run: |
          tinyjs.cmd version
          tinyjs.cmd build
          $v = (Get-Content tinyjs.json | ConvertFrom-Json).version
          $stage = Join-Path $env:RUNNER_TEMP 'stage/ai-kickstart'
          New-Item -ItemType Directory -Force $stage, ../out | Out-Null
          Copy-Item dist/ai-kickstart.exe, dist/launcher.exe $stage
          Compress-Archive -Path $stage -DestinationPath "../out/ai-kickstart-app-$v-${{ matrix.label }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: out/*.zip
          if-no-files-found: error

  prerelease:
    if: startsWith(github.ref, 'refs/tags/app-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Every asset is a real zip
        run: for z in out/*.zip; do unzip -tq "$z" || exit 1; unzip -l "$z"; done
      - name: Create pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/*.zip --prerelease --latest=false \
            --title "AI Kickstart app ${GITHUB_REF_NAME#app-v} (test build)" --notes-file app/TEST-BUILD.md
