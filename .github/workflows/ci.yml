name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Privacy scrub + kit consistency
        env:
          # Optional repository secret: private terms joined with "|". Without it the scrub is skipped with a warning.
          SCRUB_PATTERN: ${{ secrets.SCRUB_PATTERN }}
        run: scripts/check.sh --optional-scrub

  tools:
    # The vault tools promise Mac, Windows and Linux on Python 3.9+ (macOS's built-in Python is 3.9).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.x"]
        include:
          - os: ubuntu-latest
            python: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Vault tools self-test
        run: python vault/_system/tools/selftest.py -v
      - name: Template vault lints clean
        run: python vault/_system/tools/vault_lint.py --strict

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Parser tests (packages/core, against the real kit files)
        run: pnpm test
      - name: Type check
        run: pnpm check
      - name: Build ai-kickstart.me
        run: pnpm build
      - name: Built site makes no third-party requests, links resolve
        run: python3 scripts/check_site.py

  app:
    # The companion app's page and backend type-check and lint on every push (K25).
    # Packaged builds need tinyjs and run on app-v* tags (app.yml).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter @ai-kickstart/app lint
      - name: Type-check page and backend, bundle the page
        run: pnpm --filter @ai-kickstart/app build
