name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Privacy scrub + kit consistency
        env:
          # Optional repository secret: private terms joined with "|". Without it the scrub is skipped with a warning.
          SCRUB_PATTERN: ${{ secrets.SCRUB_PATTERN }}
        run: scripts/check.sh --optional-scrub
