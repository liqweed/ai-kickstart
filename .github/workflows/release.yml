name: Release

# On a vX.Y tag: run all checks, build the zip, create a GitHub Release with the CHANGELOG section as notes.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Tag matches VERSION
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "$tag" != "$version" ]; then echo "Tag v$tag does not match VERSION $version" >&2; exit 1; fi
      - name: Check + build
        env:
          SCRUB_PATTERN: ${{ secrets.SCRUB_PATTERN }}
        run: scripts/build.sh --optional-scrub
      - name: Release notes from CHANGELOG
        run: |
          awk -v v="## ${GITHUB_REF_NAME} " 'index($0, v) == 1 {on=1; next} /^## / && on {exit} on' CHANGELOG.md > notes.md
          printf '\n---\nDownload **ai-kickstart-%s.zip** below, unzip it, and open `START-HERE.html`.\n' "$GITHUB_REF_NAME" >> notes.md
          cat notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A second copy under a fixed name, so releases/latest/download/ai-kickstart.zip always works.
          cp "dist/ai-kickstart-${GITHUB_REF_NAME}.zip" dist/ai-kickstart.zip
          gh release create "$GITHUB_REF_NAME" "dist/ai-kickstart-${GITHUB_REF_NAME}.zip" dist/ai-kickstart.zip --title "AI Kickstart ${GITHUB_REF_NAME}" --notes-file notes.md
