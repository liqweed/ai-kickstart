<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:relative;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:10px;min-width:0;height:100%;box-sizing:border-box">
  <div style="display:flex;align-items:center;gap:12px;padding:8px 8px 8px 16px;border-bottom:1px dashed var(--line)">
    <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:1px">
      <span style="font:600 15px/1.35 var(--sans);color:var(--ink)">{{ label }}</span>
      <sc-if value="{{ hasNote }}"><span style="font:14px/1.4 var(--sans);color:var(--muted)">{{ note }}</span></sc-if>
    </div>
    <button type="button" onClick="{{ copy }}" aria-label="{{ copyAria }}" style="flex:none;min-height:44px;min-width:88px;padding:0 16px;border-radius:8px;border:1.5px solid var(--accent);background:{{ btnBg }};color:{{ btnFg }};font:600 15px/1 var(--sans);cursor:pointer">{{ copyLabel }}</button>
  </div>
  <div style="padding:14px 16px 16px;font:15px/1.65 var(--mono);color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere"><sc-for list="{{ segs }}" as="s" hint-placeholder-count="1"><sc-if value="{{ s.isText }}">{{ s.text }}</sc-if><sc-if value="{{ s.isPh }}"><span style="background:var(--hl);border-bottom:2px dashed var(--hl-line);border-radius:3px;padding:1px 1px;white-space:nowrap">&lt;<input type="text" value="{{ s.value }}" placeholder="{{ s.name }}" size="{{ s.size }}" onChange="{{ s.onChange }}" aria-label="{{ s.aria }}" style="font:inherit;color:var(--ink);background:transparent;border:0;padding:0;margin:0;max-width:100%">&gt;</span></sc-if></sc-for></div>
  <sc-if value="{{ hasPh }}"><p style="margin:0;padding:0 16px 12px;font:13px/1.4 var(--sans);color:var(--muted)">Dashed parts in &lt;angle brackets&gt; are yours. Type into them, or copy as-is and fill in later.</p></sc-if>
  <span aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">{{ live }}</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:480,&quot;height&quot;:260},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Gift&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;text&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&lt;Name&gt;'s birthday is on &lt;date&gt;. Using their people profile, suggest 5 gift ideas at around &lt;budget&gt;, ranked, with where to get them.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;note&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;fills&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Record&lt;string,string&gt;&quot;}}">
class Component extends DCLogic {
  state = { vals: {}, copied: false };
  segs() {
    const t = this.props.text || '', out = [], re = /<([^<>\n]+)>/g; let last = 0, m;
    while ((m = re.exec(t))) { if (m.index > last) out.push({ t: 'x', v: t.slice(last, m.index) }); out.push({ t: 'p', v: m[1] }); last = re.lastIndex; }
    if (last < t.length) out.push({ t: 'x', v: t.slice(last) });
    return out;
  }
  val(n) { const v = this.state.vals[n]; if (v !== undefined) return v; return (this.props.fills || {})[n] || ''; }
  async copy() {
    const txt = this.segs().map(s => s.t === 'x' ? s.v : (this.val(s.v).trim() || '<' + s.v + '>')).join('');
    let ok = false;
    try { await navigator.clipboard.writeText(txt); ok = true; } catch (e) {
      const ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select(); try { ok = document.execCommand('copy'); } catch (_) {} ta.remove();
    }
    this.setState({ copied: ok });
    clearTimeout(this.t); this.t = setTimeout(() => this.setState({ copied: false }), 2600);
  }
  componentWillUnmount() { clearTimeout(this.t); }
  renderVals() {
    const segs = this.segs(), label = this.props.label || 'Prompt', c = this.state.copied;
    return {
      label, note: this.props.note || '', hasNote: !!this.props.note,
      hasPh: segs.some(s => s.t === 'p'),
      segs: segs.map(s => {
        const v = s.t === 'p' ? this.val(s.v) : '';
        return { isText: s.t === 'x', isPh: s.t === 'p', text: s.v, name: s.v, value: v,
          size: Math.max(v.length, s.v.length) + 1, aria: 'Fill in: ' + s.v,
          onChange: e => { const nv = e.target.value; this.setState(st => ({ vals: { ...st.vals, [s.v]: nv } })); } };
      }),
      copy: () => this.copy(), copyLabel: c ? 'Copied ✓' : 'Copy', copyAria: 'Copy prompt: ' + label,
      btnBg: c ? 'var(--accent)' : 'transparent', btnFg: c ? 'var(--on-accent)' : 'var(--accent)',
      live: c ? 'Copied. Paste it into your AI.' : ''
    };
  }
}
</script>
</body>
</html>
